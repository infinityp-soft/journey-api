# /etc/nginx/sites-available/journey-api
# Enable: sudo ln -s /etc/nginx/sites-available/journey-api /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d api.example.com

upstream journey_api {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://journey_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
