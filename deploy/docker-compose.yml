# บนเซิร์ฟเวอร์ต้องมี: docker-compose.yml + .env + ซอร์สสาม repo
#
#   /opt/journey/
#     journey-api/
#     journey-web/
#     jourey-web-admin/
#     deploy/
#
#   docker compose up -d --build
#
# ไม่ใช้ nginx — เปิดพอร์ต Next ออกเครื่อง แล้ว rewrite /api /media ไป api

name: journey

services:
  api:
    build:
      context: ../journey-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      JSON_BODY_LIMIT_MB: ${JSON_BODY_LIMIT_MB:-10}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      MEDIA_DRIVER: rustfs
      # relative — response จึงไม่ผูกกับ IP ของเครื่อง
      PUBLIC_MEDIA_URL: /media
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_FORCE_PATH_STYLE: "true"
      # ใช้ตอน sh seed.sh เท่านั้น
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@journeyth-edu.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Administrator}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    # พอร์ต 3000 ไม่เปิดออกเครื่อง — เข้าผ่าน Next rewrite ที่ web / web-admin
    # ไม่รัน migrate ตอนสตาร์ท — ใช้ sh migrate.sh แยก

  web:
    container_name: journey-web-1
    build:
      context: ../journey-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_MEDIA_URL: /media
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        INTERNAL_API_URL: http://api:3000/api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:3000/api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_started

  web-admin:
    container_name: journey-web-admin-1
    build:
      context: ../jourey-web-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_MEDIA_URL: /media
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
        INTERNAL_API_URL: http://api:3000/api
        SERVER_ACTION_ORIGINS: ${SERVER_ACTION_ORIGINS:-}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8081}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:3000/api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_started

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs:/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  rustfs:
