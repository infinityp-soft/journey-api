# HTTP อย่างเดียว — ยังไม่มีโดเมน เข้าผ่าน http://<IP>
#
#   /api    /media   → api :3000
#   /                → web :3002 (Next.js standalone)
#
# มีโดเมนแล้วให้เพิ่ม server block :443 โดยใช้ location ชุดเดิม แล้ว redirect 80 → 443
# ไม่ต้อง rebuild image เพราะ URL ทั้งหมดเป็น relative

upstream journey_api {
    server api:3000;
}

upstream journey_web {
    server web:3002;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # เผื่อไว้สำหรับ certbot webroot ตอนใส่โดเมนภายหลัง
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        proxy_pass http://journey_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /media {
        proxy_pass http://journey_api;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /_next/static {
        proxy_pass http://journey_web;
        include /etc/nginx/conf.d/proxy_params.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://journey_web;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
