services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://journey:secret@db:5432/journey?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      UPLOAD_DIR: /data/uploads
      PUBLIC_MEDIA_URL: http://localhost:3000/media
    volumes:
      - media:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: journey
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media:
  pgdata:
