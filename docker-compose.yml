services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://journey:secret@db:5432/journey?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      PUBLIC_MEDIA_URL: http://localhost:3000/media
      MEDIA_DRIVER: rustfs
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: journey-media
      RUSTFS_ACCESS_KEY: journey
      RUSTFS_SECRET_KEY: change-me-rustfs-secret
    depends_on:
      db:
        condition: service_healthy
      # No health gate: the API boots without RustFS and creates the bucket on
      # the first upload.
      rustfs:
        condition: service_started

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      RUSTFS_ACCESS_KEY: journey
      RUSTFS_SECRET_KEY: change-me-rustfs-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: journey
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rustfs:
  pgdata:
